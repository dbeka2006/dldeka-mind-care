<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindBridge — 감정 상태 기반 맞춤 솔루션</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger-bg: #fef2f2;
      --danger-text: #b91c1c;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px 60px;
    }

    .container { max-width: 760px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 1.75rem; font-weight: 800; color: var(--primary); }
    header p { color: var(--muted); font-size: 0.95rem; margin-top: 6px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .emotion-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    @media (max-width: 540px) {
      .emotion-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .emotion-btn {
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: 12px;
      padding: 14px 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .emotion-btn:hover { border-color: var(--primary); background: #fafaff; }
    .emotion-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
    }

    .emotion-btn .emoji { font-size: 1.5rem; display: block; margin-bottom: 4px; }
    .emotion-btn .label { font-weight: 700; font-size: 0.95rem; display: block; }
    .emotion-btn .desc { font-size: 0.78rem; color: var(--muted); }

    .slider-wrap { margin-bottom: 20px; }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .intensity-badge {
      background: var(--primary);
      color: #fff;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }
    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .memo-input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      margin-bottom: 16px;
    }

    .memo-input:focus { outline: none; border-color: var(--primary); }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:hover { opacity: 0.92; }

    #result-card { display: none; border-top: 4px solid var(--primary); }

    .alert-banner {
      background: var(--danger-bg);
      color: var(--danger-text);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }

    .solution-grid { display: grid; gap: 12px; }
    .sol-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .sol-box h3 { font-size: 0.88rem; color: var(--primary); margin-bottom: 4px; }
    .sol-box p { font-size: 0.95rem; color: var(--text); }

    .context-tip {
      margin-top: 12px;
      background: var(--primary-light);
      color: #3730a3;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }

    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      background: #fcfdff;
    }

    .history-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 2px; }
    .history-main { font-size: 0.92rem; font-weight: 600; }
    .history-sub { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

    .del-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .clear-all-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .empty-msg { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 16px 0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>MindBridge</h1>
      <p>지금 느끼는 감정과 강도를 선택하면 맞춤형 행동 솔루션을 처방합니다.</p>
    </header>

    <section class="card">
      <div class="section-title">1. 현재 가장 가까운 감정을 선택하세요</div>
      <div class="emotion-grid">
        <button type="button" class="emotion-btn active" data-emotion="anxiety">
          <span class="emoji">😰</span>
          <span class="label">불안 · 초조</span>
          <span class="desc">실수할까 봐 걱정됨</span>
        </button>
        <button type="button" class="emotion-btn" data-emotion="burnout">
          <span class="emoji">🪫</span>
          <span class="label">무기력 · 번아웃</span>
          <span class="desc">아무것도 하기 싫음</span>
        </button>
        <button type="button" class="emotion-btn" data-emotion="anger">
          <span class="emoji">😤</span>
          <span class="label">분노 · 스트레스</span>
          <span class="desc">짜증나고 답답함</span>
        </button>
        <button type="button" class="emotion-btn" data-emotion="sadness">
          <span class="emoji">🌧️</span>
          <span class="label">슬픔 · 우울</span>
          <span class="desc">마음이 가라앉음</span>
        </button>
        <button type="button" class="emotion-btn" data-emotion="distracted">
          <span class="emoji">🌀</span>
          <span class="label">집중 저하 · 산만</span>
          <span class="desc">머릿속이 복잡함</span>
        </button>
        <button type="button" class="emotion-btn" data-emotion="calm">
          <span class="emoji">🌿</span>
          <span class="label">평온 · 뿌듯</span>
          <span class="desc">에너지를 유지하고 싶음</span>
        </button>
      </div>

      <div class="slider-wrap">
        <div class="slider-header">
          <label for="intensity-slider">2. 감정의 강도는 어느 정도인가요?</label>
          <span class="intensity-badge" id="intensity-value">5점 (중간)</span>
        </div>
        <input type="range" id="intensity-slider" min="1" max="10" value="5" />
        <div class="slider-labels">
          <span>1 (약함)</span>
          <span>5 (보통)</span>
          <span>10 (매우 강함)</span>
        </div>
      </div>

      <div class="section-title">3. 지금 어떤 상황인가요? (선택)</div>
      <input
        type="text"
        id="memo-input"
        class="memo-input"
        placeholder="예: 작업 마감 전 오류가 나서 마음이 급함, 잠을 못 자서 피곤함"
      />

      <button type="button" class="submit-btn" id="generate-btn">맞춤 솔루션 처방받기</button>
    </section>

    <section class="card" id="result-card">
      <div class="section-title">
        <span id="result-title">처방 결과</span>
      </div>

      <div class="alert-banner" id="high-intensity-alert">
        ⚠️ 감정 강도가 매우 높습니다(8점 이상). 지금은 문제를 해결하려 애쓰기보다 하던 일을 10분간 멈추고 신체 긴장을 먼저 낮추세요.
      </div>

      <div class="solution-grid">
        <div class="sol-box">
          <h3>⚡ 지금 당장 실행할 3분 행동</h3>
          <p id="sol-action"></p>
        </div>
        <div class="sol-box">
          <h3>🧭 생각을 전환하는 질문</h3>
          <p id="sol-reframe"></p>
        </div>
        <div class="sol-box">
          <h3>🎧 추천 휴식 및 환경 세팅</h3>
          <p id="sol-env"></p>
        </div>
      </div>

      <div class="context-tip" id="context-tip"></div>
    </section>

    <section class="card">
      <div class="section-title">
        <span>최근 감정 기록 히스토리</span>
        <button type="button" class="clear-all-btn" id="clear-all-btn">전체 삭제</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </section>
  </div>

  <script>
    const SOLUTIONS = {

          reframe: "최악의 시나리오가 일어난다 해도, 내가 다시 복구할 수 있는 첫 번째 단계는 무엇인가요?",

        },
        high: {

          reframe: "완벽하게 해내야 한다는 생각을 내려놓고 '초안만 만든다'고 기준을 낮추면 어떨까요?",
          env: "모든 메신저·이메일 창을 15분간 닫고 어두운 조명에서 눈을 감고 휴식하세요."

      burnout: {

          reframe: "지금 내 배터리가 20% 이하라면, 충전 없이 계속 달리는 게 맞을까요?",
          env: "가사가 없는 어쿠스틱 연주곡을 틀고 15분간 짧은 낮잠이나 눈 휴식을 취하세요."

        high: {

          reframe: "지금 나에게 필요한 것은 '더 나은 계획'이 아니라 '죄책감 없는 휴식'이 아닐까요?",

      },
      anger: {

          reframe: "이 상황에서 내가 진짜로 지키고 싶었던 기준이나 원칙은 무엇이었나요?",
          env: "시원한 물 한 컵을 마시고 창문을 열어 바깥 공기를 깊게 들이마시세요."
        },
        mid: {
          action: "주먹을 5초간 꽉 쥐었다가 힘을 완전히 빼는 근육 이완을 4회 반복해 교감신경을 가라앉히세요.",

          reframe: "지금 내 에너지를 상대방이나 상황에 전부 소모할 가치가 정말 있나요?",

        name: "집중 저하 · 산만",

          reframe: "머리가 멈춘 상태에서 화면만 바라보는 시간을 끊어낼 타이밍이 아닐까요?",

        }
      },
      calm: {
        name: "평온 · 뿌듯",
        low: {

          env: "현재의 차분한 집중력을 활용해 평소 미뤄둔 기획이나 정리를 20분간 진행해 보세요."
        },
        mid: {
          action: "성취감을 느낄 수 있는 핵심 목표 1가지를 선정해 지금의 긍정 에너지로 밀고 나가 보세요.",
          reframe: "이 좋은 흐름을 내일도 이어가기 위해 오늘 저녁에 준비해 둘 것은 무엇인가요?",
          env: "경쾌한 재즈나 인스트루멘탈 음악과 함께 작업 효율을 즐겨보세요."
        },
        high: {
          action: "오늘 이룬 성과를 스스로 충분히 축하하고, 주변 팀원이나 지인에게 짧은 감사 인사를 건네보세요.",
          reframe: "이 긍정적인 에너지를 다음 도전에 어떻게 연결하면 좋을까요?",
          env: "과도한 야근이나 무리로 에너지를 다 쓰지 않도록 기분 좋을 때 깔끔하게 마무리하세요."
        }
      }
    };

    const KEYWORD_TIPS = [
      {
        keywords: ["잠", "수면", "피곤", "졸려", "밤샘"],
        tip: "💡 상황 맞춤 팁: 수면 부족이 감지되었습니다. 카페인 추가 섭취 대신 15~20분 이내의 짧은 낮잠이 감정 회복에 훨씬 효과적입니다."
      },
      {
        keywords: ["오류", "에러", "배포", "마감", "코드", "깃허브", "테스트"],
        tip: "💡 상황 맞춤 팁: 작업·기술 이슈로 인한 긴장이 감지되었습니다. 전체를 한 번에 고치려 하지 말고, 가장 작은 문제 1개만 분리해 확인해 보세요."
      },
      {
        keywords: ["사람", "팀원", "회의", "갈등", "말", "눈치"],
        tip: "💡 상황 맞춤 팁: 대인관계 스트레스가 감지되었습니다. 상대의 의도를 추측하기보다 '관찰한 사실'과 '내가 필요한 요청' 2문장으로만 정리해 보세요."
      }
    ];

    let selectedEmotion = "anxiety";
    const STORAGE_KEY = "mindbridge_emotion_logs_v1";

    document.querySelectorAll(".emotion-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".emotion-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        selectedEmotion = btn.dataset.emotion;
      });
    });

    const slider = document.getElementById("intensity-slider");
    const intensityValue = document.getElementById("intensity-value");
    slider.addEventListener("input", () => {
      const val = Number(slider.value);
      const levelText = val <= 3 ? "약함" : val <= 7 ? "중간" : "강함";
      intensityValue.textContent = `${val}점 (${levelText})`;
    });

    document.getElementById("generate-btn").addEventListener("click", () => {
      const intensity = Number(slider.value);
      const memo = document.getElementById("memo-input").value.trim();
      const data = SOLUTIONS[selectedEmotion];

      const tier = intensity <= 3 ? "low" : intensity <= 7 ? "mid" : "high";
      const prescription = data[tier];

      document.getElementById("result-title").textContent =
        `[${data.name} · 강도 ${intensity}점] 맞춤 솔루션 처방`;

      const alertBanner = document.getElementById("high-intensity-alert");
      alertBanner.style.display = intensity >= 8 ? "block" : "none";

      document.getElementById("sol-action").textContent = prescription.action;
      document.getElementById("sol-reframe").textContent = prescription.reframe;
      document.getElementById("sol-env").textContent = prescription.env;

      const contextTipEl = document.getElementById("context-tip");
      const matched = KEYWORD_TIPS.find((item) =>
        item.keywords.some((kw) => memo.includes(kw))
      );

      if (matched) {
        contextTipEl.textContent = matched.tip;
        contextTipEl.style.display = "block";
      } else {
        contextTipEl.style.display = "none";
      }

      const resultCard = document.getElementById("result-card");
      resultCard.style.display = "block";
      resultCard.scrollIntoView({ behavior: "smooth", block: "nearest" });

      saveLog({
        id: Date.now(),
        time: new Date().toLocaleString("ko-KR", {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }),
        emotionName: data.name,
        intensity,
        memo,
        actionSummary: prescription.action
      });
    });

    function getLogs() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveLog(entry) {
      const logs = getLogs();
      logs.unshift(entry);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs.slice(0, 20)));
      renderLogs();
    }

    function deleteLog(id) {
      const logs = getLogs().filter((item) => item.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
      renderLogs();
    }

    document.getElementById("clear-all-btn").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      renderLogs();
    });

    function renderLogs() {
      const listEl = document.getElementById("history-list");
      const logs = getLogs();

      if (logs.length === 0) {
        listEl.innerHTML = `<div class="empty-msg">아직 기록된 감정 처방 내역이 없습니다.</div>`;
        return;
      }

      listEl.innerHTML = logs
        .map(
          (item) => `
          <div class="history-item">
            <div>
              <div class="history-meta">${item.time} · 강도 ${item.intensity}점</div>
              <div class="history-main">${item.emotionName}${item.memo ? ` — "${escapeHtml(item.memo)}"` : ""}</div>
              <div class="history-sub">처방: ${escapeHtml(item.actionSummary)}</div>
            </div>
            <button type="button" class="del-btn" onclick="deleteLog(${item.id})">삭제</button>
          </div>
        `
        )
        .join("");
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    renderLogs();
  </script>
</body>
</html>
